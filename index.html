<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>PACO SHOWDOWN</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1a7 7 0 1 0 6.1 10.5L8 8l6.1-3.5A7 7 0 0 0 8 1z' fill='%23ffe600'/></svg>" />
  </head>
  <body>
    <div id="app">
      <!-- Title -->
      <section id="screen-title" class="screen">
        <h1 class="logo"><span class="logo-paco">PACO</span><span class="logo-show">SHOWDOWN</span></h1>
        <canvas id="attract" width="224" height="40"></canvas>
        <div class="menu">
          <button class="btn" data-action="single">1 PLAYER</button>
          <button class="btn" data-action="multi">MULTIPLAYER</button>
        </div>
        <div class="help">
          <p>ARROWS / WASD / SWIPE TO MOVE</p>
          <p>P PAUSE &nbsp; M MUTE</p>
        </div>
        <p class="credit">&copy; 2026 PACO SHOWDOWN &middot; AN ORIGINAL MAZE-CHASE GAME</p>
      </section>

      <!-- Character setup -->
      <section id="screen-setup" class="screen hidden">
        <h2 id="setup-title">CHOOSE YOUR PACO</h2>
        <label class="field">NICKNAME <input id="nick" maxlength="10" autocomplete="off" spellcheck="false" /></label>
        <h3>PACO</h3>
        <div id="pac-skins" class="skins"></div>
        <div id="ghost-section">
          <h3>GHOST</h3>
          <div id="ghost-skins" class="skins"></div>
        </div>
        <div class="menu row" id="setup-single">
          <button class="btn" data-action="back">BACK</button>
          <button class="btn primary" data-action="start-single">START</button>
        </div>
        <div class="menu" id="setup-multi">
          <div class="row">
            <button class="btn" data-action="back">BACK</button>
            <button class="btn primary" data-action="host">HOST GAME</button>
          </div>
          <div class="row join-row">
            <input id="join-code" placeholder="CODE" maxlength="5" autocomplete="off" spellcheck="false" />
            <button class="btn" data-action="join">JOIN</button>
          </div>
        </div>
      </section>

      <!-- Lobby -->
      <section id="screen-lobby" class="screen hidden">
        <h2>ROOM CODE</h2>
        <div class="code-box"><span id="room-code">-----</span> <button class="btn small" data-action="copy">COPY</button></div>
        <p class="hint" id="lobby-hint">SHARE THIS CODE WITH FRIENDS</p>
        <ul id="lobby-players" class="players"></ul>
        <div class="menu row">
          <button class="btn" data-action="leave">LEAVE</button>
          <button class="btn primary" data-action="start-multi" id="btn-start-multi">START</button>
        </div>
      </section>

      <!-- Game -->
      <section id="screen-game" class="screen hidden">
        <div id="game-wrap">
          <div id="canvas-box"><canvas id="game"></canvas></div>
          <aside id="side">
            <h3>PLAYERS</h3>
            <ol id="scoreboard"></ol>
            <div id="side-help">
              <p>ARROWS/WASD</p>
              <p>M MUTE</p>
              <p id="pause-help">P PAUSE</p>
              <p>ESC MENU</p>
            </div>
          </aside>
        </div>
        <div id="dpad" class="hidden">
          <button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="right">▶</button><button data-dir="down">▼</button>
        </div>
      </section>

      <!-- Game over -->
      <section id="screen-over" class="screen hidden">
        <h2 class="red">GAME OVER</h2>
        <ol id="final" class="players"></ol>
        <div class="menu row">
          <button class="btn" data-action="menu">MENU</button>
          <button class="btn primary" data-action="again" id="btn-again">PLAY AGAIN</button>
        </div>
      </section>

      <div id="toast" class="hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
